general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.config/hypr/berk.png
    blur_passes = 2
    blur_size = 7
    brightness = 0.5
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

# clock
label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(ffffffcc)
    font_size = 18
    font_family = GeistMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = -1
    outer_color = rgb(ffffff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    check_color = rgb(aaaaaa)
    fail_color = rgb(ffffff)
    capslock_color = rgb(ffffff)
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = <b>wrong</b>
    position = 0, -60
    halign = center
    valign = center
}
